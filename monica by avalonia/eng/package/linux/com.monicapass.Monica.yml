app-id: com.monicapass.Monica
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: monica
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=home
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: monica
    buildsystem: simple
    build-commands:
      - install -d /app/lib/monica
      - cp -a publish/. /app/lib/monica/
      - chmod +x /app/lib/monica/Monica.App
      - install -Dm755 monica-wrapper /app/bin/monica
      - install -Dm644 monica.desktop /app/share/applications/com.monicapass.Monica.desktop
      - install -Dm644 monica.png /app/share/icons/hicolor/256x256/apps/com.monicapass.Monica.png
      - install -Dm644 com.monicapass.Monica.metainfo.xml /app/share/metainfo/com.monicapass.Monica.metainfo.xml
    sources:
      - type: dir
        path: publish
        dest: publish
      - type: file
        path: monica-wrapper
      - type: file
        path: monica.desktop
      - type: file
        path: monica.png
      - type: file
        path: com.monicapass.Monica.metainfo.xml
